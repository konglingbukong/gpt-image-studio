<!doctype html>
<html><head><meta charset="utf-8">
<style>
body{font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei UI",sans-serif;margin:0;padding:14px;width:270px;color:#1d1c1a;background:#fff}
h1{font-size:14px;margin:0 0 10px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#d9622b;display:inline-block}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:#7a786f;font-size:12px}
.ok{color:#2f7d50}.bad{color:#c0392b}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
label{font-size:12px;color:#7a786f}
select,input{font:inherit;border:1px solid #e6e5e1;border-radius:7px;padding:4px 6px}
button{font:inherit;border:0;border-radius:8px;padding:7px 10px;background:#d9622b;color:#fff;cursor:pointer;width:100%;margin-top:12px}
@media (prefers-color-scheme:dark){body{background:#201f1d;color:#ecebe6}select,input{background:#1a1918;color:#ecebe6;border-color:#33322e}}
</style></head>
<body>
<h1><span class="dot"></span><span data-m="name"></span></h1>
<div class="muted" data-m="lastBalance"></div>
<div class="big" id="amount">—</div>
<div class="muted" id="when"></div>
<div class="muted" id="push"></div>
<div class="row"><label data-m="interval"></label>
  <select id="interval"><option value="0"></option><option value="1">1h</option><option value="3">3h</option><option value="6">6h</option><option value="12">12h</option><option value="24">24h</option></select></div>
<div class="row"><label data-m="port"></label><input id="port" type="number" style="width:80px"></div>
<button id="now" data-m="syncNow"></button>
<div class="muted" style="margin-top:8px" data-m="hint"></div>
<script src="popup.js"></script>
</body></html>
