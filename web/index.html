<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT Image Studio</title>
<style>
:root{
  --bg:#f4f4f2; --panel:#ffffff; --panel-2:#f7f7f5; --line:#e6e5e1; --text:#1d1c1a; --muted:#7a786f; --faint:#a8a69d;
  --accent:#d9622b; --accent-2:#c4521f; --accent-soft:#fcebe2; --chip:#efeeea; --chip-h:#e6e4df;
  --ok:#2f7d50; --ok-soft:#e3f2e8; --warn:#b7791f; --warn-soft:#fbf0dc; --danger:#c0392b; --danger-soft:#fbe5e2;
  --shadow:0 1px 2px rgba(20,20,10,.05),0 6px 20px rgba(20,20,10,.06);
  --shadow-lg:0 10px 40px rgba(20,20,10,.16);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#151513; --panel:#201f1d; --panel-2:#1a1918; --line:#33322e; --text:#ecebe6; --muted:#9c9a91; --faint:#6f6d66;
    --accent:#ee7d47; --accent-2:#f69564; --accent-soft:#3b281e; --chip:#2b2a27; --chip-h:#353430;
    --ok:#6cc18c; --ok-soft:#1d3125; --warn:#e3b05c; --warn-soft:#3a2f1c; --danger:#e8786b; --danger-soft:#3c211e;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.3); --shadow-lg:0 10px 40px rgba(0,0,0,.5);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 顶栏 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-right:auto;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#f0a35e);display:grid;place-items:center;color:#fff}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:13px;white-space:nowrap;box-shadow:var(--shadow)}
.pill b{font-variant-numeric:tabular-nums}
.pill .sep{width:1px;height:14px;background:var(--line)}
.pill.low{border-color:var(--warn);background:var(--warn-soft)}
.pill.click{cursor:pointer}
.pill.click:hover{border-color:var(--accent)}
.muted{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.off{background:var(--danger)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;
  color:var(--muted);box-shadow:var(--shadow)}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:760px){.brand small,.hide-sm{display:none}.top-in{padding:10px 14px}}

/* 主区 */
.wrap{max-width:1400px;margin:0 auto;padding:8px 24px 260px}
@media (max-width:760px){.wrap{padding:8px 14px 300px}}
.toolbar{display:flex;gap:10px;align-items:center;margin:8px 0 16px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:transparent;outline:none;padding:9px 0}
.stats{font-size:12px;color:var(--muted);white-space:nowrap}

.jobs{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.jobs:empty{display:none}
.job{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px 14px}
.job .who{font-weight:700;color:var(--accent);white-space:nowrap}
.job .what{flex:1;min-width:0;font-size:13px}
.job .what div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.job .sec{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
.spin{width:16px;height:16px;border:2px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.spin.w{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
@media (max-width:520px){.gallery{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  display:grid;grid-template-columns:42% 1fr;height:200px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card.new{animation:pop .9s ease-out}
@keyframes pop{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.card .imgs{position:relative;background:var(--chip);cursor:zoom-in;overflow:hidden}
.card .imgs img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.card:hover .imgs img{transform:scale(1.03)}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 16px)}
.badge{background:rgba(0,0,0,.62);color:#fff;font:600 11px/1.6 ui-monospace,Consolas,monospace;border-radius:6px;padding:0 6px;backdrop-filter:blur(4px)}
.card .count{position:absolute;bottom:8px;right:8px}
.card .body{padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .p{font-size:13.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;align-items:center;overflow:hidden;flex-wrap:nowrap}
.tag{font-size:11.5px;background:var(--chip);border-radius:6px;padding:1px 7px;color:var(--muted);white-space:nowrap;flex:none}
.tag.cost{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.fail{background:var(--danger-soft);color:var(--danger);font-weight:600}
.acts{display:flex;gap:2px;justify-content:flex-end;margin-top:auto;align-items:center}
.acts .t{margin-right:auto;font-size:11.5px;color:var(--faint)}
.acts button{border:0;background:transparent;color:var(--faint);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.acts button:hover{background:var(--chip);color:var(--accent)}
.acts button.del:hover{color:var(--danger);background:var(--danger-soft)}
.acts button.fav-on{color:#f5b301}
.acts button.fav-on svg{fill:#f5b301}
.card.running{border-color:var(--accent)}
.card.running .imgs{display:grid;place-items:center;cursor:default;background:var(--accent-soft)}
.card.running .sec{font:700 20px ui-monospace,Consolas,monospace;color:var(--accent);margin-top:8px}
.card.failed .imgs{display:grid;place-items:center;cursor:default;background:var(--danger-soft);color:var(--danger);font-size:28px}
.errtxt{font-size:12px;color:var(--danger);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 筛选 */
.fbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow);flex:none}
.fbtn:hover{color:#f5b301}
.fbtn.on{color:#f5b301;border-color:#f5b301;background:color-mix(in srgb,#f5b301 12%,var(--panel))}
.fbtn.on svg{fill:#f5b301}
.dd{position:relative;flex:none}
.ddbtn{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);min-width:100px;justify-content:space-between}
.ddmenu{position:absolute;top:calc(100% + 6px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:130px;display:none;z-index:25}
.ddmenu.open{display:block}
.ddmenu div{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.ddmenu div:hover{background:var(--chip)}
.ddmenu div.on{color:var(--accent);font-weight:600}
.ddmenu small{color:var(--muted);font-weight:400}
.search{height:40px}
.empty{text-align:center;color:var(--muted);padding:80px 20px}
.empty .big{font-size:40px;margin-bottom:8px}

/* 底部输入框 */
.composer{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(980px,calc(100% - 32px));z-index:30;
  background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:12px 14px 10px}
@media (max-width:760px){.composer{bottom:10px;width:calc(100% - 20px);padding:10px}}
.composer.drag{border-color:var(--accent);background:var(--accent-soft)}
.refs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.refs:empty{display:none}
.ref{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;border:1px solid var(--line);flex:none}
.ref img{width:100%;height:100%;object-fit:cover}
.ref button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;line-height:18px;padding:0}
.ref.mask{outline:2px dashed var(--accent);outline-offset:-2px}
.composer textarea{width:100%;border:0;outline:none;resize:none;background:transparent;min-height:48px;max-height:40vh;padding:4px 2px;line-height:1.6}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.ctl{position:relative}
.cbtn{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--chip);border-radius:10px;padding:5px 10px;font-size:13px;white-space:nowrap}
.cbtn:hover,.cbtn.open{background:var(--chip-h)}
.cbtn .ic{width:15px;height:15px}
.est{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.est b{color:var(--accent)}
.send{width:40px;height:40px;border-radius:12px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.send:hover{background:var(--accent-2)}
.send:disabled{opacity:.55;cursor:wait}
.err{color:var(--danger);font-size:12px;margin-top:6px}
.err:empty{display:none}
.pop{position:absolute;bottom:calc(100% + 8px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);
  padding:12px;min-width:240px;display:none;z-index:40}
.pop.open{display:block}
.pop h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:3px 11px;font-size:13px;user-select:none;cursor:pointer}
.chip:hover{background:var(--chip-h)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pop .opt{display:flex;justify-content:space-between;gap:16px;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.pop .opt:hover{background:var(--chip)}
.pop .opt.on{color:var(--accent);font-weight:600}
.pop .opt small{color:var(--muted);font-weight:400}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label{font-size:12px;color:var(--muted);font-weight:600}
.inp,select.inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--panel-2);outline:none}
.inp:focus{border-color:var(--accent)}
select option{background:var(--panel)}
.hint{font-size:12px;color:var(--muted)}
.hint code{background:var(--chip);border-radius:4px;padding:0 4px;font-size:11px}

/* 灯箱 */
.lb{position:fixed;inset:0;background:rgba(10,10,8,.88);display:none;z-index:50;padding:20px;gap:20px}
.lb.open{display:flex}
.lb .pic{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;min-height:0}
.lb .pic img{max-width:100%;max-height:calc(100vh - 90px);border-radius:10px;object-fit:contain}
.lb .thumbs{display:flex;gap:8px}
.lb .thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;opacity:.5;cursor:pointer;border:2px solid transparent}
.lb .thumbs img.on{opacity:1;border-color:var(--accent)}
.lb .info{width:360px;background:var(--panel);border-radius:16px;padding:18px;overflow:auto;max-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:12px}
.lb .x{position:absolute;top:14px;right:18px;color:#fff;font-size:30px;background:none;border:0;line-height:1}
@media (max-width:860px){.lb.open{flex-direction:column;overflow:auto}.lb .info{width:auto;max-height:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv span{color:var(--muted)}
.kv b{font-weight:500;word-break:break-all}
.ptext{white-space:pre-wrap;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.65;max-height:40vh;overflow:auto}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);color:#fff}

/* 设置 */
.modal{position:fixed;inset:0;background:rgba(10,10,8,.45);display:none;z-index:60;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.dlg{background:var(--panel);border-radius:20px;box-shadow:var(--shadow-lg);width:min(820px,100%);height:min(620px,calc(100vh - 40px));display:flex;flex-direction:column;overflow:hidden}
.dlg-h{display:flex;align-items:center;gap:10px;padding:18px 22px;font-size:17px;font-weight:700}
.dlg-h .ver{margin-left:auto;font:12px monospace;color:var(--muted);font-weight:400}
.dlg-h .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1}
.dlg-b{flex:1;display:flex;min-height:0}
.nav{width:180px;padding:4px 12px;display:flex;flex-direction:column;gap:2px;flex:none}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:10px;text-align:left;color:var(--muted)}
.nav button:hover{background:var(--chip)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pane{flex:1;overflow:auto;padding:4px 22px 22px;border-left:1px solid var(--line)}
.pane section{display:none}
.pane section.on{display:block}
.pane h3{font-size:14px;margin:6px 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row{display:flex;gap:8px;align-items:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch div small{display:block;color:var(--muted);font-size:12px}
.tg{width:38px;height:22px;border-radius:999px;background:var(--chip-h);position:relative;border:0;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tg.on{background:var(--accent)}
.tg.on::after{left:19px}
.msg{font-size:12px;padding:8px 10px;border-radius:9px;margin-top:8px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.bad{background:var(--danger-soft);color:var(--danger)}
.msg:empty{display:none}
.balbox{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.balbox small{display:block;font-size:12px;color:var(--muted)}
.balbox b{font-size:18px;font-variant-numeric:tabular-nums}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px;border-top:1px solid var(--line)}
@media (max-width:700px){.dlg{height:calc(100vh - 20px)}.dlg-b{flex-direction:column}.nav{width:auto;flex-direction:row;overflow-x:auto;padding:0 12px 8px}
  .nav button{white-space:nowrap}.pane{border-left:0;border-top:1px solid var(--line);padding-top:14px}.grid2{grid-template-columns:1fr}.balbox{grid-template-columns:1fr 1fr}}
body.mode-browser .local-only{display:none!important}
body.mode-local .browser-only{display:none!important}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TIERS=["1K","2K","4K"], RATIOS=["16:9","9:16","1:1","4:3","3:4","3:2","2:3","21:9"];
const QUALS=["low","medium","high","xhigh","max","auto"];
const MODELS=[["gpt-image-2.5-sunburst","model.sunburst"],["gpt-image-2.5-flare","model.flare"]];
const st={tier:"2K",ratio:"16:9",quality:"high",model:"gpt-image-2.5-sunburst",n:1,refs:[],mask:null,busy:false};
let S={}, HIST=[], CUR_SIZE="", BAL=null;

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=v=>v==null?"—":`$${v.toFixed(Math.abs(v)<0.1?4:Math.abs(v)<10?3:2)}`;
/* 第二货币：设置里的 fx_code / fx_rate；老配置只有 usd_to_cny 的当人民币；都没有就按界面语言给默认 */
function fxCfg(){
  if(S.fx_code!==undefined&&S.fx_code!==null)return[S.fx_code||"",+S.fx_rate||0];
  if(S.usd_to_cny)return["CNY",+S.usd_to_cny];
  return FX_DEFAULT[LANG]||["",0];
}
const fx=v=>{const[c,r]=fxCfg();if(v==null||!c||!r)return"";const d=r>=100?0:2;
  return(FX_SYMBOL[c]||c+" ")+(v*r).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})};
const money=v=>{const f=fx(v);return f?`${usd(v)} (${f})`:usd(v)};

/* 两种模式：
 *  local   —— 连着本机服务（server.py）：和对话同步、图存文件夹、key 在本机文件
 *  browser —— 没有本机服务（比如在 GitHub Pages 上、别的电脑上打开）：backend.js 在浏览器里直接调 OpenAI
 */
const LOCAL="http://127.0.0.1:8765";
let MODE="local", BASE="";
// served by a local service (any port, e.g. a second instance via GPT_IMAGE_PORT)?
const isLocalHost=()=>location.protocol==="http:"&&/^(127\.0\.0\.1|localhost|gpt-image\.localhost)$/.test(location.hostname);
let SERVED_LOCAL=false;
const onLocalServer=()=>SERVED_LOCAL;
async function detectMode(){
  if(isLocalHost()){
    try{const r=await fetch("/api/status",{signal:AbortSignal.timeout(1500)});
      if(r.ok&&(r.headers.get("content-type")||"").includes("json")){SERVED_LOCAL=true;MODE="local";BASE="";return}}catch(e){}
  }
  if(load("conn","auto")!=="browser"){
    try{const r=await fetch(LOCAL+"/api/status",{signal:AbortSignal.timeout(1500)});if(r.ok){MODE="local";BASE=LOCAL;return}}catch(e){}
  }
  MODE="browser";BASE="";
}
const api=(p,b)=>MODE==="browser"?BB.handle(p,b):fetch(BASE+p,b?{method:"POST",body:JSON.stringify(b)}:undefined).then(r=>r.json());
function store(k,v){try{localStorage.setItem("gi2_"+k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{const v=localStorage.getItem("gi2_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)}
const fileUrl=p=>MODE==="browser"?p:BASE+"/img/"+encodeURIComponent(p.split(/[\\/]/).pop());
const fileName=(m,p,j=0)=>MODE==="browser"?`${m.id}${m.files.length>1?"_"+(j+1):""}.${m.params.output_format||"png"}`:p.split(/[\\/]/).pop();
async function downloadImg(url,name){
  // 跨域地址加 download 属性没用，先取成 blob 再下载
  const b=await fetch(url).then(r=>r.blob());const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);
}

function applyMode(){
  document.body.classList.toggle("mode-browser",MODE==="browser");
  document.body.classList.toggle("mode-local",MODE==="local");
  // 页面本身就是本机服务提供的，就没有「要不要连本机」可选
  $("#connRow").style.display=onLocalServer()?"none":"flex";
  $("#connTg").classList.toggle("on",load("conn","auto")!=="browser");
  $("#connHint").textContent=t(MODE==="local"?"conn.hint.local":"conn.hint.browser");
}
$("#connTg").onclick=()=>{const on=!$("#connTg").classList.contains("on");store("conn",on?"auto":"browser");location.reload()};

/* ---------- 语言 ---------- */
function drawLangMenu(){$("#langMenu").innerHTML=LANGS.map(([c,n])=>`<div data-l="${c}" class="${LANG===c?"on":""}">${n}</div>`).join("")}
$("#langBtn").onclick=e=>{e.stopPropagation();drawLangMenu();$("#langMenu").classList.toggle("open")};
$("#langMenu").onclick=e=>{const d=e.target.closest("[data-l]");if(!d)return;setLang(d.dataset.l);$("#langMenu").classList.remove("open");rerender()};
function rerender(){applyI18n();applyMode();renderComposer();drawRefs();drawGallery();poll(true);if($("#settings").classList.contains("open"))fillSettings()}

/* ---------- 底部参数 ---------- */
function sizeText(){const c=$("#customSize").value.trim();return c||`${st.tier} ${st.ratio}`}
function renderComposer(){
  $("#lblModel").textContent=st.model.replace("gpt-image-","");
  $("#lblQ").textContent=st.quality;
  $("#lblN").textContent=t("n.imgs",{n:st.n});
  $("#lblSize").textContent=$("#customSize").value.trim()||`${st.tier} · ${st.ratio}`;
  const known=MODELS.some(([v])=>v===st.model);
  $("#popModel").innerHTML=MODELS.map(([v,k])=>`<div class="opt ${st.model===v?"on":""}" data-v="${v}">${v}<small>${t(k)}</small></div>`).join("")
    +`<div style="padding:8px 4px 2px"><input class="inp" id="customModel" placeholder="${esc(t("model.customPh"))}" value="${known?"":esc(st.model)}"></div>`;
  $("#popQ").innerHTML=QUALS.map(v=>`<div class="opt ${st.quality===v?"on":""}" data-v="${v}">${v}<small>${t("q."+v)}</small></div>`).join("");
  $("#popN").innerHTML=[1,2,3,4].map(v=>`<div class="opt ${st.n===v?"on":""}" data-v="${v}">${t("n.imgs",{n:v})}</div>`).join("");
  $("#tiers").innerHTML=TIERS.map(v=>`<span class="chip ${st.tier===v?"on":""}" data-v="${v}">${v}</span>`).join("");
  $("#ratios").innerHTML=RATIOS.map(v=>`<span class="chip ${st.ratio===v?"on":""}" data-v="${v}">${v}</span>`).join("");
  checkSize();
}
let sizeT;
function checkSize(){clearTimeout(sizeT);sizeT=setTimeout(async()=>{
  const r=await api("/api/size",{size:sizeText()});
  CUR_SIZE=r.error?"":r.size;
  $("#sizeHint").innerHTML=r.error?`<span style="color:var(--danger)">${esc(r.error)}</span>`:t("size.actual",{s:r.size.replace("x"," × ")});
  $("#est").innerHTML=estText();
},120)}
function saveComposer(){store("c",{tier:st.tier,ratio:st.ratio,quality:st.quality,model:st.model,n:st.n,custom:$("#customSize").value,
  name:$("#name").value,format:$("#format").value,moderation:$("#moderation").value,background:$("#background").value})}
function restoreComposer(){
  const c=load("c",null);
  st.tier=c?.tier||st.tier; st.ratio=c?.ratio||st.ratio;

const REF_COST={"2560x1440|high":0.06,"1440x2560|high":0.06,"3840x2160|high":0.22,"2160x3840|high":0.22};
function estUsd(){
  const hasRef=st.refs.length>0;
  const same=HIST.filter(m=>m.params.size===CUR_SIZE&&m.params.quality===st.quality&&((m.refs||[]).length>0)===hasRef&&m.cost_usd);
  if(same.length)return{v:same.reduce((a,m)=>a+m.cost_usd/(m.files.length||1),0)/same.length*st.n,src:t("est.src.hist",{n:same.length})};
  const r=REF_COST[`${CUR_SIZE}|${st.quality}`];
  return r?{v:r*st.n,src:t("est.src.ref")}:null;
}

async function go(){

  if(!prompt){$("#err").textContent=t("err.noPrompt");return}
  if(st.mask&&!st.refs.length){$("#err").textContent=t("err.maskNeedsRef");return}
  const e=estUsd(), lim=+S.confirm_over_usd||0;
  if(lim&&e&&e.v>lim&&!confirm(t("confirm.cost",{v:money(e.v),lim:usd(lim)})))return;
  st.busy=true;$("#err").textContent="";$("#go").disabled=true;$("#go").innerHTML=`<span class="spin w"></span>`;
  try{
    const r=await api("/api/generate",{prompt,size:sizeText(),quality:st.quality,model:st.model,n:st.n,format:$("#format").value,
      moderation:$("#moderation").value,background:$("#background").value,name:$("#name").value.trim()||"img",refs:st.refs,mask:st.mask});
    if(r.error){$("#err").textContent=r.error}
    else{toast(t("toast.done",{v:money(r.cost_usd)}));if(S.clear_after_submit){$("#prompt").value="";store("prompt","");autoGrow()}
      await loadHistory(r.time);poll(true)}
  }catch(err){$("#err").textContent=t("err.request")+err}

function ratioOf(size){const [w,h]=String(size).split("x").map(Number);if(!w||!h)return"";const g=(a,b)=>b?g(b,a%b):a,d=g(w,h);
  const r=`${w/d}:${h/d}`;const known={"16:9":1.778,"9:16":.5625,"4:3":1.333,"3:4":.75,"3:2":1.5,"2:3":.667,"1:1":1,"21:9":2.333};
  if(known[r])return r;for(const[k,v]of Object.entries(known))if(Math.abs(w/h-v)<.02)return k;return r}

      <div class="body"><div class="p">${esc(m.params.prompt)}</div>
        ${fail?`<div class="errtxt">${esc(m.error||t("fail"))}</div>`:""}
        <div class="tags">${fail?`<span class="tag fail">${t("fail")}</span>`:`<span class="tag cost">${usd(m.cost_usd)}</span>`}
          <span class="tag">${m.params.quality}</span><span class="tag">${m.params.model.replace("gpt-image-","")}</span>

let lastSig=null,pollT;
async function poll(once){
  clearTimeout(pollT);
  try{
    const s=await api("/api/status");
    BAL=s.balance;
    const sp=s.spend,b=s.balance;
    const wallet=`<svg class="ic" style="width:15px;height:15px;color:var(--muted)"><use href="#i-wallet"/></svg>`;
    $("#balPill").className="pill click"+(b.set&&b.low?" low":"");
    $("#balPill").innerHTML=b.set?`${wallet}<span class="muted">${t("bal.label")}</span><b>${usd(b.remaining)}</b><span class="muted">${fx(b.remaining)}</span>${b.low?`<span style="color:var(--warn)">${t("bal.low")}</span>`:""}`
      :`${wallet}<span class="muted">${t("bal.unset")}</span>`;
    $("#spendPill").innerHTML=`<span class="muted">${t("spend.today")}</span><b>${usd(sp.today)}</b><span class="muted">${t("spend.times",{n:sp.count_today})}</span><span class="sep"></span><span class="muted">${t("spend.month")}</span><b>${usd(sp.month)}</b>`;
    const runKey=r=>r.map(j=>j.started).join(",");
    const runChanged=runKey(s.running)!==runKey(RUNNING);
    RUNNING=s.running;
    if(lastSig!==null&&s.sig!==lastSig&&!st.busy){const old=HIST[0]?.time;await loadHistory();const n=HIST[0];
      if(n&&n.time!==old){drawGallery(n.time);toast(n.status==="failed"?t("toast.newFail"):t("toast.newImg",{v:money(n.cost_usd)}))}}
    else if(runChanged)drawGallery();
    else $$(".card.running .sec").forEach((e,i)=>{if(RUNNING[i])e.textContent=RUNNING[i].elapsed+"s"});
    lastSig=s.sig;
    $("#syncPill").innerHTML=MODE==="local"?`<span class="dot"></span><span>${t(BASE?"sync.connected":"sync.live")}</span>`:`<span class="dot" style="background:var(--accent)"></span><span>${t("sync.browser")}</span>`;
    if($("#settings").classList.contains("open"))drawBalBox();
  }catch(e){$("#syncPill").innerHTML=`<span class="dot off"></span><span>${t("sync.off")}</span>`}
  if(!once)pollT=setTimeout(poll,2000);
}

  if(S.timeout==null)$("#s_timeout").value=900;
  if(S.confirm_over_usd==null)$("#s_confirm_over_usd").value=0.5;
  const[fc,fr]=fxCfg();$("#s_fx_code").value=fc;$("#s_fx_rate").value=fr||"";
  $("#s_api_key").value="";$("#s_api_key").placeholder=S.api_key_masked?t("key.current",{k:S.api_key_masked}):"sk-…";
  const src=MODE==="browser"?t("be.keySrc"):S.key_source;
  $("#keyHint").textContent=S.api_key_masked?t(MODE==="browser"?"keyHint.browser":"keyHint.local",{src})
    :t(MODE==="browser"?"keyHint.noneBrowser":"keyHint.none");
  $("#s_agent_name").value=S.agent_name||"";
  $("#s_admin_key").value="";$("#s_admin_key").placeholder=S.admin_key_masked?t("key.current",{k:S.admin_key_masked}):t("admin.ph");
  $("#s_clear_after_submit").classList.toggle("on",!!S.clear_after_submit);
  for(const k of ["text_in","image_in","image_out"])$("#r_"+k).value=S.rates[k];
  $("#r_per_image").value=+S.rates.per_image?S.rates.per_image:"";
  $("#s_balance").value="";
  drawBalBox();
  const imgs=HIST.reduce((a,m)=>a+m.files.length,0),tot=HIST.reduce((a,m)=>a+(m.cost_usd||0),0);
  $("#dataBox").innerHTML=`<div><small>${t("data.records")}</small><b>${t("data.groups",{n:HIST.length})}</b></div>
    <div><small>${t("data.images")}</small><b>${t("data.imagesN",{n:imgs})}</b></div><div><small>${t("data.total")}</small><b>${usd(tot)}</b></div>`;
  if(MODE==="browser"){
    const mb=S.storage_bytes!=null?`${(S.storage_bytes/1048576).toFixed(1)} MB`:"—";
    $("#dataBox").innerHTML+=`<div style="grid-column:1/-1"><small>${t("data.storage")}</small><b style="font-size:15px">${mb}</b></div>`;
    $("#aboutKv").innerHTML=kv("about.version","v"+S.version)+kv("about.mode",t("mode.browserLong"))+kv("about.dataAt",t("about.browserStore"))
      +kv("about.url",esc(location.href.split("#")[0]));
    return;
  }
  $("#aboutKv").innerHTML=kv("about.version","v"+S.version)+kv("about.mode",t(BASE?"mode.connected":"mode.local"))
    +kv("about.localSvc","http://127.0.0.1:8765"+t("about.localOnly"))+kv("about.skillDir",esc(S.skill_dir))
    +kv("about.config",esc(S.config_file))+kv("about.outDir",esc(S.out_dir))+kv("about.start",t("about.startVal"));
}
function drawBalBox(){
  const b=BAL||{};
  if(!b.set){$("#balBox").innerHTML=`<div style="grid-column:1/-1" class="hint">${t("bal.notCal")}</div>`;return}
  if(b.source==="relay"){
    $("#balBox").innerHTML=`<div><small>${t("bal.label")}</small><b style="color:${b.low?"var(--warn)":"var(--text)"}">${usd(b.remaining)}</b><small>${fx(b.remaining)}</small></div>
      <div><small>${t("bal.relayTotal")}</small><b>${usd(b.amount)}</b><small>${t("bal.srcRelay")}</small></div>
      <div><small>${t("bal.relayUsed")}</small><b>${usd(b.spent)}</b><small>${t("bal.srcRelay")}</small></div>`;return}
  const d=new Date(b.at*1000);
  $("#balBox").innerHTML=`<div><small>${t("bal.remaining")}</small><b style="color:${b.low?"var(--warn)":"var(--text)"}">${usd(b.remaining)}</b><small>${fx(b.remaining)}</small></div>
    <div><small>${t("bal.atCal")}</small><b>${usd(b.amount)}</b><small>${d.toLocaleString(LANG==="zh"?"zh-CN":LANG)}</small></div>
    <div><small>${t("bal.spentAfter")}</small><b>${usd(b.spent)}</b><small>${t(b.source==="admin"?"bal.srcAdmin":"bal.srcLocal")}</small></div>
    ${b.error?`<div style="grid-column:1/-1;color:var(--warn);font-size:12px">${esc(b.error)}</div>`:""}`;
}
$("#s_clear_after_submit").onclick=$("#s_minimal_params").onclick=e=>e.currentTarget.classList.toggle("on");
function collect(){
  const num=id=>{const v=$(id).value;return v===""?null:+v};
  const fxCode=$("#s_fx_code").value, fxRate=num("#s_fx_rate");
  const b={api_url:$("#s_api_url").value.trim(),proxy:$("#s_proxy").value.trim(),model:$("#s_model").value.trim()||"gpt-image-2.5-sunburst",size:$("#s_size").value.trim()||"2K 16:9",
    quality:$("#s_quality").value,format:$("#s_format").value,moderation:$("#s_moderation").value,out_dir:$("#s_out_dir").value.trim(),
    fx_code:fxCode,fx_rate:fxRate,low_balance_warn:num("#s_low_balance_warn"),timeout:num("#s_timeout"),confirm_over_usd:num("#s_confirm_over_usd"),
    clear_after_submit:$("#s_clear_after_submit").classList.contains("on"),agent_name:$("#s_agent_name").value.trim(),
    minimal_params:$("#s_minimal_params").classList.contains("on"),balance_source:$("#s_balance_source").value,
    rates:{text_in:num("#r_text_in"),image_in:num("#r_image_in"),image_out:num("#r_image_out"),per_image:num("#r_per_image")||0}};
  if(fxCode==="CNY"&&fxRate)b.usd_to_cny=fxRate;  // 兼容老字段（命令行脚本用它显示人民币）
  if($("#s_api_key").value.trim())b.api_key=$("#s_api_key").value.trim();
  if($("#s_admin_key").value.trim())b.admin_key=$("#s_admin_key").value.trim();
  return b;
}
$("#s_fx_code").onchange=()=>{const c=$("#s_fx_code").value;const d=Object.values(FX_DEFAULT).find(x=>x[0]===c);
  if(d&&!$("#s_fx_rate").value)$("#s_fx_rate").value=d[1]};
$("#setSave").onclick=async()=>{
  const r=await api("/api/settings",collect());
  if(r.error){$("#saveMsg").className="msg bad";$("#saveMsg").textContent=r.error;return}
  S=r;fillSettings();await poll(true);await loadHistory();
  $("#saveMsg").className="msg ok";$("#saveMsg").textContent=t("saved");setTimeout(()=>$("#saveMsg").textContent="",1500);
};
$("#calBtn").onclick=async()=>{
  const v=$("#s_balance").value;if(v===""){toast(t("toast.fillBal"));return}
  const r=await api("/api/settings",{...collect(),balance_amount:+v});
  if(r.error){toast(r.error);return}S=r;await poll(true);fillSettings();toast(t("toast.calibrated"));
};
$("#shutBtn").onclick=async()=>{
  if(!confirm(t("confirm.shutdown")))return;
  try{await api("/api/shutdown",{})}catch(e){}
  closeSettings();toast(t("toast.shutdown"));
};
$("#testBtn").onclick=async()=>{
  $("#testMsg").className="msg";$("#testMsg").textContent=t("testing");
  const r=await api("/api/test",{api_url:$("#s_api_url").value.trim(),proxy:$("#s_proxy").value.trim(),api_key:$("#s_api_key").value.trim(),model:$("#s_model").value});
  $("#testMsg").className="msg "+(r.ok?"ok":"bad");$("#testMsg").textContent=r.msg;
};

/* ---------- 启动 ---------- */
(async()=>{
  applyI18n();
  await detectMode();
  applyMode();
  S=await api("/api/settings");
  restoreComposer();renderComposer();drawRefs();
  await loadHistory();poll();
  if(MODE==="browser"&&!S.api_key_masked){openSettings("api");toast(t("toast.needKey"))}
})();
</script>
</body>
</html>
